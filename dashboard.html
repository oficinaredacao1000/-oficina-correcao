<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha plataforma</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><aside class="side"><a class="brand" href="index.html">OFICINA <span>DE REDAÇÃO</span><small>1000</small></a><nav><a class="active" href="dashboard.html">Visão geral</a><a href="#enviar">Enviar redação</a><a href="#historico">Histórico</a><a id="adminLink" hidden href="admin.html">Administração</a></nav><button id="logout" class="logout">Sair</button></aside>
<main class="dash"><div class="mobilebrand brand">OFICINA <span>DE REDAÇÃO</span><small>1000</small></div><header><div><p class="eyebrow">MINHA PLATAFORMA</p><h1 id="hello">Olá!</h1></div><div id="role" class="pill">Aluno</div></header>
<section class="cards"><div><span>Redações</span><strong id="count">0</strong></div><div><span>Última nota</span><strong id="last">—</strong></div><div><span>Status</span><strong>Ativo</strong></div></section>
<section id="enviar" class="panel"><h2>Enviar redação</h2><form id="essayForm"><input id="title" placeholder="Título da redação"><input id="theme" placeholder="Tema"><textarea id="content" rows="12" placeholder="Cole ou escreva sua redação aqui..." required></textarea><button class="btn">Enviar para correção</button><div id="essayMsg" class="msg"></div></form></section>
<section id="historico" class="panel"><h2>Histórico</h2><div id="history" class="history"></div></section></main>
<script src="dashboard.js"></script></body></html>

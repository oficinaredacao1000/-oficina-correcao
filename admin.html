<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><aside class="side"><a class="brand" href="index.html">OFICINA <span>DE REDAÇÃO</span><small>1000</small></a><nav><a href="dashboard.html">Visão geral</a><a class="active" href="admin.html">Administração</a></nav></aside>
<main class="dash"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Painel de controle</h1><section class="panel"><h2>Usuários</h2><div id="users">Carregando...</div></section><section class="panel"><h2>Prompts</h2><form id="promptForm"><input id="ptitle" placeholder="Título do prompt" required><textarea id="pstatement" placeholder="Enunciado / prompt" required></textarea><button class="btn">Salvar prompt</button></form><div id="prompts"></div></section></main>
<script>
const sb=supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.key);
(async()=>{const {data:{user}}=await sb.auth.getUser(); if(!user){location='login.html';return;} const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single(); if(p?.role!=='admin'){location='dashboard.html';return;} load();})();
async function load(){let {data:u}=await sb.from('profiles').select('*').order('created_at',{ascending:false}); users.innerHTML=u.map(x=>`<div class="row"><span>${esc(x.full_name||'Sem nome')}</span><span>${x.role} · ${x.active?'Ativo':'Bloqueado'}</span></div>`).join(''); let {data:pr}=await sb.from('prompts').select('*').order('created_at',{ascending:false}); prompts.innerHTML=(pr||[]).map(x=>`<div class="row"><span>${esc(x.title)}</span><span>${x.active?'Ativo':'Inativo'}</span></div>`).join('');}
promptForm.onsubmit=async e=>{e.preventDefault();let {error}=await sb.from('prompts').insert({title:ptitle.value,statement:pstatement.value}); if(error) alert(error.message); else {ptitle.value='';pstatement.value='';load();}};
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
